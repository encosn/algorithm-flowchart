name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # 단위 시험 93개 (flowchart-core 52 + algorithm-core 41)
      - run: npm test
      - run: npm run build
      # enablement: true 를 주면 저장소 Settings > Pages 를 손으로 켜지 않아도
      # 워크플로가 Pages 를 켜고 source 를 GitHub Actions 로 맞춰 준다.
      # (새 저장소는 GITHUB_TOKEN 만으로 이것이 실패할 수 있다. 그때는 사람 계정 토큰으로
      #  gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow 를 한 번 실행한다)
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
